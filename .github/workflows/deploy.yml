name: publicar-livro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/gerar_erratas.py
      - run: jupyter-book build . --warningiserror --keep-going
      - name: Publicar o livro em PDF num endereço fixo (abre no navegador)
        run: cp livro/XRiscs_Derivativos_com_Python.pdf _build/html/livro.pdf
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          publish_branch: gh-pages
