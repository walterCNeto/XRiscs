name: testes-notebooks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # segundas, 03:17 de Brasília
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
